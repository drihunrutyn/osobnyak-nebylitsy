name: Publish public website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/web/**"
      - "package.json"
      - "bun.lock"
      - "__ports.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Build public frontend only (no server secrets)
        working-directory: packages/web
        run: bun run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4